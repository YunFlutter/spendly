name: Android Preview Build

on:
  workflow_dispatch:
    inputs:
      format:
        description: Build output
        required: true
        default: apk
        type: choice
        options:
          - apk
          - appbundle

concurrency:
  group: android-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.3
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build preview APK
        if: inputs.format == 'apk'
        run: flutter build apk --debug

      - name: Build preview app bundle
        if: inputs.format == 'appbundle'
        run: flutter build appbundle --debug

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: spendly-android-${{ inputs.format }}-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
